<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FF6B4A"><meta name="description" content="좋아하는 한마디를 주워, 내 말로. 영상 속 표현을 모으고, 따라 말하고, 3일간 복습하는 나만의 표현 수집함, 말줍."><title>말줍 · 나만의 표현 수집함</title><link rel="stylesheet" href="src/style.css"></head><body>
<aside><a class="brand" href="#" aria-label="말줍"><img class="brand-logo" src="assets/maljup-logo.png" alt="말줍" width="1983" height="793" decoding="async"></a><div class="eyebrow">MY LEARNING SPACE</div><nav><button data-view="home" class="active">◫ <span>학습 대시보드</span></button><button data-view="library">▤ <span>내 표현 수집함</span></button><button data-view="review">↻ <span>오늘의 복습</span><b id="dueBadge">0</b></button><button data-view="recordings">♬ <span>녹음 보관함</span></button><button data-view="calendar">▦ <span>학습 달력</span></button><button data-view="checklist">☑ <span>암기 체크리스트</span></button></nav><div class="aside-note"><span>마음에 드는 말을 주워,<br>나만의 표현으로 모아요.</span><p>첫 학습 + 다음 3일 복습</p><div>○ ─ ○ ─ ○ ─ ●</div></div><button class="settings" data-view="settings">⚙ 데이터 관리</button><div class="local">● 이 브라우저에 안전하게 저장</div></aside>
<main><header><div id="breadcrumb">MY COLLECTION / 대시보드</div><span class="date" id="date"></span></header><section id="content"></section><footer>말줍 <span>좋아하는 한마디를 주워, 내 말로.</span></footer></main>
<dialog id="editor"><form id="cardForm"><div class="modal-top"><span class="eyebrow">COLLECT A PHRASE</span><button type="button" class="icon" data-close="editor" aria-label="닫기">×</button></div><h2>기억하고 싶은 표현</h2><label>표현 · 문장<textarea name="text" required maxlength="1500" placeholder="예: Let's take it one step at a time."></textarea></label><label class="select-row"><input name="mustMemorize" type="checkbox">꼭 외울 문장 · 체크리스트에 담기</label><label>뜻<input name="meaning" maxlength="1000" placeholder="한 번에 한 걸음씩 해보자."></label><label>문맥 · 학습 메모<textarea name="note" maxlength="3000" placeholder="어떤 상황에서 쓰였나요? 나만의 예문도 적어보세요."></textarea></label><div class="two"><label>유튜브 링크 (선택)<input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label>시작 시간 (초)<input name="start" type="number" min="0" value="0" required></label></div><label>수집 카테고리<input name="category" maxlength="24" placeholder="단어, 문장, 표현 등"></label><label>영상 제목 · 출처<input name="source" maxlength="200" placeholder="나의 영상 / 직접 작성"></label><button class="primary wide">내 표현 수집함에 저장 ↗</button></form></dialog>
<dialog id="detail"><div id="detailContent"></div></dialog><div id="toast" role="status"></div><script type="module" src="src/app.js"></script></body></html>
