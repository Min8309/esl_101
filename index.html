<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254d3e"><title>Phrase Garden · 나의 표현 정원</title><link rel="stylesheet" href="src/style.css"></head><body>
<aside><a class="brand" href="#">❋ <span>phrase garden<small>나의 표현 정원</small></span></a><div class="eyebrow">MY LEARNING SPACE</div><nav><button data-view="home" class="active">◫ <span>학습 대시보드</span></button><button data-view="library">▤ <span>내 학습함</span></button><button data-view="review">↻ <span>오늘의 복습</span><b id="dueBadge">0</b></button><button data-view="recordings">♬ <span>녹음 보관함</span></button></nav><div class="aside-note"><span>작은 표현이 쌓여,<br>나의 언어가 됩니다.</span><p>첫 학습 + 다음 3일 복습</p><div>○ ─ ○ ─ ○ ─ ●</div></div><button class="settings" data-view="settings">⚙ 데이터 관리</button><div class="local">● 이 브라우저에 안전하게 저장</div></aside>
<main><header><div id="breadcrumb">MY GARDEN / 대시보드</div><span class="date" id="date"></span></header><section id="content"></section><footer>PHRASE GARDEN <span>좋아하는 순간을, 나의 표현으로.</span></footer></main>
<dialog id="editor"><form id="cardForm"><div class="modal-top"><span class="eyebrow">COLLECT A PHRASE</span><button type="button" class="icon" data-close="editor" aria-label="닫기">×</button></div><h2>기억하고 싶은 표현</h2><label>표현 · 문장<textarea name="text" required maxlength="1500" placeholder="예: Let's take it one step at a time."></textarea></label><label>뜻<input name="meaning" maxlength="1000" placeholder="한 번에 한 걸음씩 해보자."></label><label>문맥 · 학습 메모<textarea name="note" maxlength="3000" placeholder="어떤 상황에서 쓰였나요? 나만의 예문도 적어보세요."></textarea></label><div class="two"><label>유튜브 링크 (선택)<input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label>시작 시간 (초)<input name="start" type="number" min="0" value="0" required></label></div><label>영상 제목 · 출처<input name="source" maxlength="200" placeholder="나의 영상 / 직접 작성"></label><button class="primary wide">내 학습함에 저장 ↗</button></form></dialog>
<dialog id="detail"><div id="detailContent"></div></dialog><div id="toast" role="status"></div><script type="module" src="src/app.js"></script></body></html>
